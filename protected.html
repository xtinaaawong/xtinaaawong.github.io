<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Protected</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'JetBrains Mono', monospace;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #CAD2DE;
      overflow: hidden;
      gap: 24px;
    }

    /* ── Liquid blob layer ── */
    .blob-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      filter: blur(80px) saturate(1.1);
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.85;
    }

    .blob-1 {
      width: 65vw; height: 65vw;
      background: radial-gradient(circle, #CAD2DE 0%, transparent 70%);
      top: -10%; left: -15%;
      animation: drift1 14s ease-in-out infinite;
    }
    .blob-2 {
      width: 55vw; height: 55vw;
      background: radial-gradient(circle, #EEE9D6 0%, transparent 70%);
      bottom: -15%; right: -10%;
      animation: drift2 12s ease-in-out infinite;
    }
    .blob-3 {
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, #889881 0%, transparent 70%);
      top: 30%; left: 35%;
      animation: drift3 16s ease-in-out infinite;
    }
    .blob-4 {
      width: 40vw; height: 40vw;
      background: radial-gradient(circle, #EEE9D6 0%, transparent 70%);
      top: 5%; right: 10%;
      animation: drift4 10s ease-in-out infinite;
    }
    .blob-5 {
      width: 45vw; height: 45vw;
      background: radial-gradient(circle, #CAD2DE 0%, transparent 70%);
      bottom: 0%; left: 25%;
      animation: drift5 13s ease-in-out infinite;
    }

    @keyframes drift1 {
      0%   { transform: translate(0, 0) scale(1); }
      20%  { transform: translate(20vw, 15vh) scale(1.1); }
      45%  { transform: translate(10vw, 40vh) scale(0.95); }
      70%  { transform: translate(30vw, 20vh) scale(1.05); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes drift2 {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(-25vw, -20vh) scale(1.05); }
      55%  { transform: translate(-10vw, -40vh) scale(0.9); }
      80%  { transform: translate(-30vw, -10vh) scale(1.1); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes drift3 {
      0%   { transform: translate(0, 0) scale(1); }
      30%  { transform: translate(-20vw, -25vh) scale(1.15); }
      60%  { transform: translate(15vw, -15vh) scale(0.88); }
      85%  { transform: translate(-10vw, 20vh) scale(1.05); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes drift4 {
      0%   { transform: translate(0, 0) scale(1); }
      35%  { transform: translate(-15vw, 30vh) scale(1.1); }
      65%  { transform: translate(-30vw, 15vh) scale(0.92); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes drift5 {
      0%   { transform: translate(0, 0) scale(1); }
      40%  { transform: translate(20vw, -30vh) scale(1.08); }
      70%  { transform: translate(10vw, -15vh) scale(0.95); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* ── Shake animation ── */
    @keyframes shake {
      0%   { transform: translateX(0); }
      15%  { transform: translateX(-6px); }
      30%  { transform: translateX(6px); }
      45%  { transform: translateX(-5px); }
      60%  { transform: translateX(5px); }
      75%  { transform: translateX(-3px); }
      90%  { transform: translateX(3px); }
      100% { transform: translateX(0); }
    }

    .shake { animation: shake 0.4s ease; }

    /* ── Lock icon ── */
    .lock-icon {
      width: 40px;
      height: auto;
    }
    @media (max-width: 767px) {
      .lock-icon { width: 20px; }
    }

    /* ── Password card ── */
    .card {
      background: #ffffff;
      border: 1px solid #c7c7c7;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 360px;
      max-width: calc(100vw - 48px);
      border-radius: 4px;
    }

    /* ── Label ── */
    .pwd-label {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* ── Input row ── */
    .input-row {
      display: flex;
      gap: 8px;
    }

    /* ── Input ── */
    .password-input {
      flex: 1;
      height: 36px;
      padding: 0 12px;
      background: #ffffff;
      border: 1px solid #c7c7c7;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s ease;
      appearance: none;
      -webkit-appearance: none;
    }

    .password-input:focus {
      border-color: #33373C;
    }

    .password-input.error {
      border-color: #C50606;
    }

    /* ── Error message ── */
    .error-msg {
      font-size: 12px;
      color: #C50606;
      letter-spacing: 0.02em;
      margin-top: 8px;
      display: none;
    }

    .error-msg.visible { display: block; }

    /* ── Button ── */
    .enter-btn {
      flex-shrink: 0;
      height: 36px;
      padding: 0 16px;
      background: #33373C;
      border: none;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ffffff;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .enter-btn:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="blob-canvas" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-5"></div>
  </div>

  <img class="lock-icon" src="lock.png" alt="lock" style="position:relative;z-index:1;" />

  <div class="card" style="position:relative;z-index:1;">
    <p class="pwd-label">Password</p>
    <div class="input-row">
      <input
        class="password-input"
        type="password"
        id="pwd"
        autocomplete="current-password"
        spellcheck="false"
      />
      <button class="enter-btn" id="enter-btn">Enter</button>
    </div>
    <p class="error-msg" id="error-msg">Incorrect password</p>
  </div>

  <script>
    const SALT = 'px7kQ2mLvR9nZw4j';
    const HASH = '3f0eb9b82e88bb33f23e2544346f3ad50bb13954850b9b0d36525589813f0103';
    const DESTINATION = 'index.html';

    const input = document.getElementById('pwd');
    const btn = document.getElementById('enter-btn');
    const errorMsg = document.getElementById('error-msg');

    async function hashInput(value) {
      const msgBuffer = new TextEncoder().encode(SALT + value);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function attempt() {
      const hashed = await hashInput(input.value);
      if (hashed === HASH) {
        sessionStorage.setItem('auth', 'true');
        window.location.href = DESTINATION;
      } else {
        input.classList.add('error');
        errorMsg.classList.add('visible');
        input.classList.remove('shake');
        void input.offsetWidth;
        input.classList.add('shake');
        input.value = '';
        input.focus();
      }
    }

    btn.addEventListener('click', attempt);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
    input.addEventListener('input', () => {
      input.classList.remove('error');
      errorMsg.classList.remove('visible');
    });
    input.addEventListener('animationend', () => input.classList.remove('shake'));
  </script>
</body>
</html>
